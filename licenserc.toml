headerPath = "license-header.txt"
strictCheck = true
useDefaultExcludes = true
includes = [
    ".github/**/*.yml",
    "CMakeLists.txt",
    "Makefile",
    "cmake/**/*.cmake",
    "cmake/**/*.cmake.in",
    "examples/**/*.cpp",
    "include/**/*.h",
    "licenserc.toml",
    "src/**/*.cpp",
    "src/**/*.h",
    "test/**/*.yaml",
    "test/**/*.yml",
    "tests/**/*.cpp",
]

[mapping.SCRIPT_STYLE]
filenames = ["CMakeLists.txt", "Makefile"]
extensions = ["cmake", "in", "yaml", "yml"]
