name: Publish Release Notes

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      target-tag:
        required: true
        type: string
        description: Target tag to run on
      dry-run:
        description: Rehearse validation, approval and protected signing without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      tag-object: ${{ steps.tag.outputs.object }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Check release account policy
        run: make release-check-user

      - name: Check release blockers
        if: inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/check_blockers.py --repo "$GITHUB_REPOSITORY"

      - name: Test trusted release tools
        run: make test-release-signing

      - name: Verify repository release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.target-tag || github.ref_name }}
        run: |
          set -eu
          python3 scripts/release/signing.py verify-tag "$RELEASE_TAG"
          printf 'name=%s\nobject=%s\ncommit=%s\n' "$RELEASE_TAG" \
            "$(git rev-parse "refs/tags/$RELEASE_TAG")" \
            "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" >> "$GITHUB_OUTPUT"

  validate-source:
    needs: validate
    # Build/lint/unit/integration checks run against the exact verified commit.
    # This reusable workflow has read-only access and no deployment environment.
    uses: ./.github/workflows/tests.yml
    with:
      source-ref: ${{ needs.validate.outputs.commit }}

  release:
    needs: [validate, validate-source]
    runs-on: ubuntu-latest
    # Approval is requested only after validation; publication gets a fresh runner.
    environment: release
    concurrency:
      group: github-release-${{ needs.validate.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Check release account policy
        run: make release-check-user

      - name: Recheck validated release tag
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag-object }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -eu
          test "$(git rev-parse "refs/tags/$RELEASE_TAG")" = "$EXPECTED_TAG_OBJECT"
          python3 scripts/release/signing.py verify-tag "$RELEASE_TAG" "$EXPECTED_COMMIT"

      - name: Recheck release blockers before publication
        if: inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/check_blockers.py --repo "$GITHUB_REPOSITORY"

      - name: Rehearse protected signing
        if: inputs.dry-run == true
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RELEASE_LOG_DIR: ${{ runner.temp }}/release-logs
        run: python3 scripts/release/signing.py exec python3 -c 'print("Protected signing rehearsal passed")'

      - name: Upload sanitized rehearsal logs
        if: always() && inputs.dry-run == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-rehearsal-logs
          path: ${{ runner.temp }}/release-logs/*.log
          if-no-files-found: ignore

      - name: Recheck published tag before GitHub release
        if: inputs.dry-run != true
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag-object }}
        run: |
          set -eu
          remote_object=$(git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" | cut -f1)
          test "$remote_object" = "$EXPECTED_TAG_OBJECT"

      - name: Create GitHub Release
        if: inputs.dry-run != true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag-object }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100
            });
            if (releases.some(release => release.tag_name === tag && release.draft)) {
              throw new Error('Existing release is a draft; reconcile it before rerunning publication');
            }
            try {
              const {data: release} = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag
              });
              if (release.draft) {
                throw new Error('Existing release is a draft; reconcile it before rerunning publication');
              }
              core.info(`Release already exists: ${release.html_url}`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const {data: tagRef} = await github.rest.git.getRef({
              ...context.repo, ref: `tags/${tag}`
            });
            const expected = process.env.EXPECTED_TAG_OBJECT;
            if (!expected || tagRef.object?.sha !== expected) {
              throw new Error('Release tag changed after validation');
            }
            await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name: tag, generate_release_notes: true
            });
