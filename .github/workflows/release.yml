name: Publish Release Notes

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      target-tag:
        required: true
        type: string
        description: Target tag to run on

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      tag-object: ${{ steps.tag.outputs.object }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Require publisher release user
        run: make release-check-user

      - name: Verify repository release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.target-tag || github.ref_name }}
        run: |
          set -eu
          python3 scripts/release/signing.py verify-tag "$RELEASE_TAG"
          printf 'name=%s\nobject=%s\n' "$RELEASE_TAG" "$(git rev-parse "refs/tags/$RELEASE_TAG")" >> "$GITHUB_OUTPUT"

  release:
    needs: validate
    runs-on: ubuntu-latest
    # Approval is requested only after validation; publication gets a fresh runner.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Require publisher release user
        run: make release-check-user

      - name: Recheck validated release tag
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ needs.validate.outputs.tag-object }}
        run: |
          set -eu
          test "$(git rev-parse "refs/tags/$RELEASE_TAG")" = "$EXPECTED_TAG_OBJECT"
          python3 scripts/release/signing.py verify-tag "$RELEASE_TAG"

      - name: Create GitHub Release
        run: |
          gh release create "$RELEASE_TAG" \
            --generate-notes \
            --title "$RELEASE_TAG" \
            --verify-tag
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
