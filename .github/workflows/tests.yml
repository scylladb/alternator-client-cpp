name: 'Run tests'

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        description: Exact source commit selected by release validation
        required: true
        type: string

defaults:
  run:
    working-directory: ./

jobs:
  test:
    name: Build lint and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      AWS_SDK_CPP_VERSION: 1.11.844
      AWS_SDK_CPP_INSTALL_DIR: ${{ github.workspace }}/.deps/aws-sdk-cpp
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/.deps/aws-sdk-cpp
      LD_LIBRARY_PATH: ${{ github.workspace }}/.deps/aws-sdk-cpp/lib:${{ github.workspace }}/.deps/aws-sdk-cpp/lib64

    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Preserve trusted command guard
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp scripts/release/guard.py scripts/release/signing.py "$RUNNER_TEMP/release-tools/"

      - name: Checkout validated release source
        if: inputs.source-ref != ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            git \
            libcurl4-openssl-dev \
            libgtest-dev \
            libssl-dev \
            ninja-build \
            openssl \
            zlib1g-dev

      - name: Check license headers
        uses: korandoru/hawkeye@453bacfa60b19044f1e0b1e6df2826a665fb3623 # v6.0.0

      - name: Cache AWS SDK for C++
        id: cache-aws-sdk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.AWS_SDK_CPP_INSTALL_DIR }}
          key: aws-sdk-cpp-${{ env.AWS_SDK_CPP_VERSION }}-dynamodb-shared-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build AWS SDK for C++
        if: steps.cache-aws-sdk.outputs.cache-hit != 'true'
        env:
          RELEASE_LOG_DIR: ${{ runner.temp }}/release-logs/aws-sdk
        run: |
          python3 "$RUNNER_TEMP/release-tools/guard.py" run sh -ec '
          git clone \
            --branch "$AWS_SDK_CPP_VERSION" \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/aws/aws-sdk-cpp.git \
            .deps/aws-sdk-cpp-src
          cmake -S .deps/aws-sdk-cpp-src -B .deps/aws-sdk-cpp-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$AWS_SDK_CPP_INSTALL_DIR" \
            -DBUILD_ONLY=dynamodb \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_TESTING=OFF \
            -DAUTORUN_UNIT_TESTS=OFF \
            -DBUILD_DEPS=ON
          cmake --build .deps/aws-sdk-cpp-build --parallel 2
          cmake --install .deps/aws-sdk-cpp-build
          '

      - name: Run build
        env:
          RELEASE_LOG_DIR: ${{ runner.temp }}/release-logs/build
        run: |
          python3 "$RUNNER_TEMP/release-tools/guard.py" run make build

      - name: Run linters
        env:
          RELEASE_LOG_DIR: ${{ runner.temp }}/release-logs/check
        run: |
          python3 "$RUNNER_TEMP/release-tools/guard.py" run make check

      - name: Run unit tests
        env:
          RELEASE_LOG_DIR: ${{ runner.temp }}/release-logs/unit
        run: |
          python3 "$RUNNER_TEMP/release-tools/guard.py" run make test-unit

      - name: Run integration tests
        env:
          RELEASE_LOG_DIR: ${{ runner.temp }}/release-logs/integration
        run: |
          python3 "$RUNNER_TEMP/release-tools/guard.py" run make test-integration

      - name: Stop Scylla
        if: always()
        env:
          RELEASE_LOG_DIR: ${{ runner.temp }}/release-logs/cleanup
        run: |
          python3 "$RUNNER_TEMP/release-tools/guard.py" run make scylla-stop

      - name: Upload sanitized validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-logs-${{ github.job }}
          path: ${{ runner.temp }}/release-logs/**/*.log
          if-no-files-found: ignore
