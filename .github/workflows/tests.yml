name: 'Run tests'

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: ./

jobs:
  test:
    name: Build lint and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      AWS_SDK_CPP_VERSION: 1.11.844
      AWS_SDK_CPP_INSTALL_DIR: ${{ github.workspace }}/.deps/aws-sdk-cpp
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/.deps/aws-sdk-cpp
      LD_LIBRARY_PATH: ${{ github.workspace }}/.deps/aws-sdk-cpp/lib:${{ github.workspace }}/.deps/aws-sdk-cpp/lib64
      SCYLLA_VERSION: release:2025.2.5
      SCYLLA_INTEGRATION_VERSION: release:2026.1.6

    steps:
      - name: Checkout source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            git \
            libcurl4-openssl-dev \
            libgtest-dev \
            libssl-dev \
            libyaml-cpp-dev \
            ninja-build \
            openssl \
            util-linux \
            zlib1g-dev

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3

      - name: Check license headers
        uses: korandoru/hawkeye@453bacfa60b19044f1e0b1e6df2826a665fb3623 # v6.0.0

      - name: Cache AWS SDK for C++
        id: cache-aws-sdk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.AWS_SDK_CPP_INSTALL_DIR }}
          key: aws-sdk-cpp-${{ env.AWS_SDK_CPP_VERSION }}-dynamodb-shared-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build AWS SDK for C++
        if: steps.cache-aws-sdk.outputs.cache-hit != 'true'
        run: |
          git clone \
            --branch "$AWS_SDK_CPP_VERSION" \
            --depth 1 \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/aws/aws-sdk-cpp.git \
            .deps/aws-sdk-cpp-src
          cmake -S .deps/aws-sdk-cpp-src -B .deps/aws-sdk-cpp-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$AWS_SDK_CPP_INSTALL_DIR" \
            -DBUILD_ONLY=dynamodb \
            -DBUILD_SHARED_LIBS=ON \
            -DENABLE_TESTING=OFF \
            -DAUTORUN_UNIT_TESTS=OFF \
            -DBUILD_DEPS=ON
          cmake --build .deps/aws-sdk-cpp-build --parallel 2
          cmake --install .deps/aws-sdk-cpp-build

      - name: Run build
        run: |
          make build

      - name: Run linters
        run: |
          make check

      - name: Run unit tests
        run: |
          make test-unit

      - name: Cache Scylla relocatable package
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.ccm/scylla-repository
          key: scylla-ccm-relocatable-${{ runner.os }}-${{ runner.arch }}-release-2025.2.5-release-2026.1.6

      - name: Run integration tests
        timeout-minutes: 30
        run: |
          make test-integration

      - name: Upload CCM diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ccm-diagnostics
          path: build/ccm/**
          if-no-files-found: ignore
